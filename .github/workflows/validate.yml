name: Atlas validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate catalog and generated views
        run: |
          python3 -m py_compile tools/atlas.py
          python3 -m unittest discover -s tests -v
          python3 tools/atlas.py validate
          git diff --check
